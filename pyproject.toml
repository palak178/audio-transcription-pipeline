[project]
name = "audio-transcription-service"
version = "0.1.0"
description = "Audio transcription pipeline: audio in, timestamped segments out."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Palak Namdev" }]
keywords = ["transcription", "whisper", "speech-to-text", "asr", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    # Imported directly by audio.py. It arrives transitively via faster-whisper, but a direct
    # import deserves a direct declaration.
    "numpy>=1.26",
    # Postgres holds job state *and* is the queue. See docs/DESIGN.md: one datastore means the
    # state machine and the queue position move in a single transaction, rather than two
    # systems that can disagree. psycopg 3, used synchronously behind a pool and called from
    # the API via anyio.to_thread — the same pattern inference already uses, so there is one
    # concurrency model in the codebase rather than two.
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    # Emulates S3 in-process, so the S3 blob store is covered by real tests rather than
    # mocks, and without anyone needing an AWS account or credentials.
    "moto[s3]>=5.0.0",
    "boto3>=1.35.0",
]

# The S3 blob store. Optional on purpose: the filesystem backend is the default and needs no
# account, which is what keeps a fresh clone fully offline.
s3 = [
    "boto3>=1.35.0",
]

[project.scripts]
transcribe = "transcription.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run excludes `slow`, so `pytest` needs no model weights and finishes in
# about a second. `make test-all` includes them.
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    "slow: requires ffmpeg-generated fixtures and a real Whisper model download",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. `File(...)` and `Form(...)` in defaults is
# the documented FastAPI idiom for declaring multipart parameters, not a mistake.
"src/transcription/api.py" = ["B008"]
