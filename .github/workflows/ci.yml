name: CI

# Fast feedback only: lint and the suite that needs no model weights. Kept separate from
# integration.yml deliberately — this job is cheap, deterministic and has no network
# dependency beyond pip, so it is the one worth gating on and the one the badge points at.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # The job tier's tests are skipped when there is no database, which is right for someone
    # cloning this to read the pipeline — and wrong for CI. A real Postgres here is what makes
    # the lease, backoff and SKIP LOCKED tests actually run rather than silently pass.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcription_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TRANSCRIBE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/transcription_test

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is the entire format-handling layer here, not an optional extra, so it is
      # installed rather than stubbed: the fast suite runs real ffmpeg and ffprobe
      # subprocesses and generates its own audio fixtures with them.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      # Docs are load-bearing here and split across six files, so a moved section is a real
      # risk. A dead link renders as a link and survives review, which is exactly why this is
      # a gate rather than a habit.
      - name: Check documentation links
        run: python scripts/check_links.py

      - name: Tests
        run: python -m pytest -q

      # The job-tier tests skip themselves when no database is reachable, so a broken service
      # block would look exactly like a green run. Fail loudly instead of quietly losing
      # coverage of the queue.
      - name: Assert the job-tier tests actually ran
        run: |
          python -m pytest tests/test_jobs.py -q 2>&1 | tee /tmp/jobs.log
          if grep -qE '^s+' /tmp/jobs.log || grep -q 'skipped' /tmp/jobs.log; then
            echo "::error::job-tier tests were skipped - Postgres was not reachable"
            exit 1
          fi
