name: Integration

# The expensive half: a real model download and a container build. Split out of ci.yml so a
# Hugging Face hiccup or a registry timeout cannot turn the main badge red for a reason that
# has nothing to do with the code.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Catches dependency rot — a new faster-whisper, PyAV or onnxruntime release breaking the
  # real-model path on a repository nobody has pushed to in a month.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    name: Real-model suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # `tiny` is 40 MB, which is what makes running the real-model suite on every push to
      # main affordable. The accuracy assertions in test_integration.py are deliberately
      # loose enough to hold at that size.
      - name: Cache model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ runner.os }}

      - name: Slow suite
        run: python -m pytest -q -m slow

  offline-container:
    name: Container runs with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The claim worth testing is not that the image builds, but that it needs no network at
      # runtime: ffmpeg and the model weights are both baked in at build time. `--network
      # none` is the only honest proof of that.
      - name: Build
        run: docker build --build-arg MODEL=tiny -t audio-transcription-service .

      - name: Transcribe with networking disabled
        run: |
          docker run --rm --network none \
            -v "$PWD/samples:/data:ro" \
            audio-transcription-service \
            transcribe /data/speech_en.mp3 --format srt

  # Proves `docker compose up` actually produces a working service: Postgres, the API and a
  # worker, with the API and worker sharing a blob volume. That sharing is the thing most
  # likely to be broken silently — give each container its own copy of the blob directory and
  # every job fails with blob_not_found, which no unit test would catch.
  compose:
    name: docker compose end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Submit a job and wait for the transcript
        run: |
          set -euo pipefail

          # Not `curl -sf | python`: -f discards the response body, so a failed submission
          # becomes an unexplained JSON parse error rather than the status and message the
          # server actually sent.
          code=$(curl -s -o /tmp/submit.json -w '%{http_code}' \
                 -F file=@samples/speech_en.mp3 http://localhost:8000/v1/jobs)
          echo "submit returned HTTP $code"
          cat /tmp/submit.json

          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "::error::submission failed with HTTP $code"
            exit 1
          fi

          id=$(python -c 'import json; print(json.load(open("/tmp/submit.json"))["id"])')
          echo "submitted job $id"

          for attempt in $(seq 1 60); do
            status=$(curl -sf "http://localhost:8000/v1/jobs/$id" \
                     | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "  attempt $attempt: $status"
            case "$status" in
              succeeded) break ;;
              failed|dead_letter)
                echo "::error::job ended as $status"
                curl -s "http://localhost:8000/v1/jobs/$id" | python -m json.tool
                exit 1 ;;
            esac
            sleep 5
          done

          if [ "$status" != "succeeded" ]; then
            echo "::error::job never finished (last status: $status)"
            exit 1
          fi

          echo "--- transcript (srt) ---"
          curl -sf "http://localhost:8000/v1/jobs/$id/transcript?format=srt"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes
