name: Integration

# The expensive half: a real model download and a container build. Split out of ci.yml so a
# Hugging Face hiccup or a registry timeout cannot turn the main badge red for a reason that
# has nothing to do with the code.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Catches dependency rot — a new faster-whisper, PyAV or onnxruntime release breaking the
  # real-model path on a repository nobody has pushed to in a month.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    name: Real-model suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # `tiny` is 40 MB, which is what makes running the real-model suite on every push to
      # main affordable. The accuracy assertions in test_integration.py are deliberately
      # loose enough to hold at that size.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ runner.os }}

      - name: Slow suite
        run: python -m pytest -q -m slow

  offline-container:
    name: Container runs with no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The claim worth testing is not that the image builds, but that it needs no network at
      # runtime: ffmpeg and the model weights are both baked in at build time. `--network
      # none` is the only honest proof of that.
      - name: Build
        run: docker build --build-arg MODEL=tiny -t audio-transcription-service .

      - name: Transcribe with networking disabled
        run: |
          docker run --rm --network none \
            -v "$PWD/samples:/data:ro" \
            audio-transcription-service \
            transcribe /data/speech_en.mp3 --format srt
